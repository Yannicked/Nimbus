version: '3.8'

services:
  nimbus:
    build:
      context: .
      dockerfile: Dockerfile
    image: nimbus-service:latest
    container_name: nimbus-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - nimbus_cache:/app/cache
    restart: unless-stopped

volumes:
  nimbus_cache:
