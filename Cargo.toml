[package]
name = "weer-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
netcdf = "0.12"
ndarray = "0.17"
image = { version = "0.25", features = ["png", "webp"] }
dashmap = "6"
tower-http = { version = "0.7", features = ["fs", "cors"] }
notify = "8"
rumqttc = { version = "0.25", features = ["websocket", "use-rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
dotenvy = "0.15"
grib-reader = "0.5"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }

